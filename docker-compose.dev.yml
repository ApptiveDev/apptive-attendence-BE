services:
  be:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db
  db:
    image: postgres:17
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - db:/var/lib/postgres/data
    environment:
      POSTGRES_USER: attendence_user
      POSTGRES_DB: attendence
      POSTGRES_PASSWORD: attendence_pass

volumes:
  db: